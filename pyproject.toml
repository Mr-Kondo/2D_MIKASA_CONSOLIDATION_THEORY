[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "2d-mikasa-consolidation-theory"
version = "0.6.1"
description = "Mikasa/Gibson-type finite-strain consolidation in material coordinates, with a linear small-strain reference"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x>=13.3; sys_platform != 'darwin'"]
notebook = ["ipykernel>=6"]

[project.scripts]
mikasa-consolidation = "mikasa_consolidation.cli:main"
