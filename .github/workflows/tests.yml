name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.15"]
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install locked dependencies
        run: uv sync --locked
      - name: Show interpreter version
        run: uv run --locked python -VV
      - name: Run tests
        run: uv run --locked python -m unittest -v
